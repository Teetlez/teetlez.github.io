{% component proc_js_canvas(script: string, author: string) %}
<script src="/js/processing.min.js"></script>
<div class="card canvas-container" style="align-items: center">
  <script
    async
    src="{{ script | safe }}"
    type="text/processing"
    class="embed_js_script"
  ></script>
  <canvas class="canvas">This browser doesn't support this canvas</canvas>
  <br />
  <i class="author">by {{ author }}</i>
</div>
{% endcomponent proc_js_canvas %}
