{% component polaroid(image: string, title: string, caption: string) %}
<div id="polaroid" class="start">
  <div id="polaroid-shine"></div>
  <div id="polaroid-photo">
    <img
      class="full has-alpha no-hover"
      width="144"
      height="144"
      alt="Me."
      src="{{ image }}"
    />
  </div>
  <span id="polaroid-title">{{ title }}</span>
  <span id="polaroid-title">{{ caption }}</span>
  <!-- <a id="statuscafe-link" href="https://status.cafe/users/daudix">
    <span id="statuscafe-time-ago">0 days ago</span>
    <span id="statuscafe-face">⏳</span>
  </a> -->
</div>

{% endcomponent polaroid %}
